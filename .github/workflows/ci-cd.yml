name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-scan-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 1) Get the source code from the repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3) Compile and run all JUnit tests using Java 17
      - name: Build and test with Maven
        run: mvn --batch-mode clean verify

      # 4) Switch to Java 21 for SonarCloud
      - name: Set up JDK 21 for SonarCloud
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 5) Run SonarCloud analysis
      - name: SonarCloud Scan
        run: mvn --batch-mode sonar:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 6) Build and push the Docker image
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/student-grade-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/student-grade-api:${{ github.sha }}